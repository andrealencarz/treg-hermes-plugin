[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-prospector"
version = "0.1.0.dev1"
description = "Prospecção Treg para Hermes"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
prospector = "prospector.cli:main"

[tool.setuptools.packages.find]
include = ["prospector*"]

[tool.setuptools.package-data]
prospector = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
